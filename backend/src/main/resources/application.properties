spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cashflowdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
google.api.key=${GOOGLE_API_KEY:}
server.port=${PORT:8080}

# Session and Cookie Configuration for Cross-Origin Support
# JSESSIONID (session) cookie configuration - allows cross-site requests in production
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true